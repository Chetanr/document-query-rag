[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-query-rag"
version = "0.1.0"
requires-python = ">=3.9.1"
dependencies = [
    "chromadb>=0.5",
    "fastapi>=0.110",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
